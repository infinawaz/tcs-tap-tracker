name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      # ── 3. Android SDK – accept licences by writing them directly ──
      # Gradle resolves SDK via local.properties, not $ANDROID_SDK_ROOT,
      # so we must accept licences in the actual SDK directory AND
      # write local.properties after cap add runs (done post cap-add below).
      - name: Accept Android SDK licences
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # Accept all licences via sdkmanager
          yes | $SDKMANAGER --licenses || true
          # Also write licence files directly so Gradle never complains
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >  "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >  "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          # Install required packages
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" || true

      # ── 4. Node.js & npm ──────────────────────────────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # ── 5. Capacitor – add & sync Android ─────────────────────────
      # android/ is gitignored; cap add generates it fresh each run
      - name: Capacitor – add Android platform
        run: npx cap add android

      - name: Write local.properties (point Gradle to correct SDK)
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Capacitor – sync web assets to Android
        run: npx cap sync android

      # ── 6. Gradle permissions ─────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 7. Cache Gradle (key uses commit SHA – gradle files exist now) ──
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Use SHA as key because android/ is generated mid-job
          # (hashFiles on *.gradle* would be evaluated before cap add runs)
          key: ${{ runner.os }}-gradle-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 8. Build debug APK ────────────────────────────────────────
      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME:     ${{ env.ANDROID_SDK_ROOT }}

      # ── 9. Upload APK artifact ────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tcs-tap-tracker-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── 10. Comment APK link on PR ────────────────────────────────
      - name: Comment APK link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Debug APK built!**\n\nDownload from [Actions artifacts](${context.payload.repository.html_url}/actions/runs/${context.runId}).`
            })
